name: Fastfetch All Modules to TXT

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  fastfetch-all:
    name: Fastfetch (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        runner:
          # Linux x64
          - ubuntu-slim
          - ubuntu-latest
          - ubuntu-24.04
          - ubuntu-22.04
          - ubuntu-26.04

          # Linux ARM64
          - ubuntu-24.04-arm
          - ubuntu-22.04-arm
          - ubuntu-26.04-arm

          # Windows x64
          - windows-latest
          - windows-2025
          - windows-2025-vs2026
          - windows-2022

          # Windows ARM64
          - windows-11-arm
          - windows-11-vs2026-arm

          # macOS Intel (x64)
          - macos-15-intel
          - macos-26-intel

          # macOS Apple Silicon (ARM64)
          - macos-latest
          - macos-14
          - macos-15
          - macos-26
          - xcode-27

    steps:
      # 1. Linux 패키지 설치
      - name: Install Fastfetch (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository ppa:zhangsongcui3371/fastfetch -y
          sudo apt-get update
          sudo apt-get install -y fastfetch

      # 2. macOS Homebrew 패키지 설치
      - name: Install Fastfetch (macOS)
        if: runner.os == 'macOS'
        run: brew install fastfetch

      # 3. Windows Chocolatey 패키지 설치
      - name: Install Fastfetch (Windows)
        if: runner.os == 'Windows'
        run: choco install fastfetch -y

      # 4. user@hostname.txt 파일명으로 저장
      - name: Run Fastfetch and Save as user@hostname.txt
        run: |
          FILENAME="$(whoami)@$(hostname).txt"
          fastfetch --pipe false > "$FILENAME"

      # 5. 각 러너별 결과 임시 업로드
      - name: Upload Individual Fastfetch Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastfetch-${{ matrix.runner }}
          path: "*.txt"

  # 모든 매트릭스 작업이 완료된 후 하나로 합치는 Job
  combine-results:
    name: Combine All Results
    needs: fastfetch-all
    runs-on: ubuntu-latest
    steps:
      # 1. 모든 fastfetch-* 아티팩트를 다운로드받아 단일 폴더에 병합
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fastfetch-*
          merge-multiple: true

      # 2. 하나로 합쳐진 txt 파일 전체를 하나의 아티팩트로 최종 업로드
      - name: Upload Combined Fastfetch Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastfetch-results
          path: "*.txt"
